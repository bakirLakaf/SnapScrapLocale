# إعداد بناء Nixpacks لبوت ضاري الفلاح على Railway.
# يثبّت ffmpeg على مستوى النظام + مكتبات بايثون من requirements.txt الجذري.

[phases.setup]
nixPkgs = ["python311", "ffmpeg"]

[phases.install]
cmds = ["pip install --no-cache-dir -r requirements.txt"]

[start]
cmd = "python railway_dari_bot/auto_dari.py"
