<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>إحصائيات قنوات يوتيوب — SnapScrap</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .video-card {
            background: rgba(20, 20, 30, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .video-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
            border-color: #ef4444;
        }

        .vid-thumb {
            width: 100%;
            aspect-ratio: 16/9;
            object-fit: cover;
            border-bottom: 2px solid #ef4444;
        }

        .vid-info {
            padding: 15px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .vid-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin: 0 0 10px 0;
            color: white;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.4;
        }

        .vid-meta {
            margin-top: auto;
            display: flex;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.4);
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 1rem;
            color: #ddd;
            font-family: monospace;
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .meta-item i {
            color: #ef4444;
        }

        .channel-header-card {
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.1), rgba(153, 27, 27, 0.3));
            border: 1px solid #ef4444;
            padding: 25px;
            border-radius: 16px;
            margin-bottom: 30px;
            box-shadow: 0 8px 32px rgba(239, 68, 68, 0.15);
        }

        .ch-stats {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 15px;
        }

        .ch-stat-badge {
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 20px;
            border-radius: 30px;
            font-weight: bold;
            color: white;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .ch-stat-badge i {
            color: #ef4444;
        }

        #loadingSpinner {
            text-align: center;
            padding: 50px;
            font-size: 1.2rem;
            color: #aaa;
            display: none;
        }
    </style>
</head>

<body>
    <div class="bg-grid"></div>
    <div class="app-layout" style="grid-template-columns: 1fr; max-width: 1200px; margin: 0 auto; padding: 20px;">
        <main class="app-content" style="padding: 0;">

            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
                <div style="display: flex; align-items: center; gap: 15px;">
                    <i class="fa-brands fa-youtube fa-3x" style="color: #ef4444;"></i>
                    <h1 style="margin: 0; font-size: 2.2rem; text-shadow: 0 0 20px rgba(239,68,68,0.5);">إحصائيات قنوات
                        يوتيوب</h1>
                </div>
                <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">
                    <i class="fa-solid fa-arrow-right"></i> العودة للوحة التحكم
                </a>
            </div>

            <section class="card" style="margin-bottom: 30px;">
                <div class="card-header">
                    <div class="header-icons">
                        <span class="icon icon-yt">▶</span>
                        <h2>اختر القناة</h2>
                    </div>
                </div>
                <div class="form input-row" style="margin-top: 15px;">
                    <select id="channelSelect" class="nice-select" style="font-size: 1.1rem; padding: 12px;">
                        <option value="">-- يرجى اختيار قناة --</option>
                        {% for ch in channels %}
                        <option value="{{ ch.id }}">{{ ch.title }}</option>
                        {% endfor %}
                    </select>
                </div>
            </section>

            <div id="loadingSpinner">
                <i class="fa-solid fa-circle-notch fa-spin fa-3x" style="color: #ef4444; margin-bottom: 15px;"></i>
                <div>جاري جلب الإحصائيات والفيديوهات من يوتيوب...</div>
            </div>

            <div id="statsContainer" style="display: none;">
                <div class="channel-header-card" id="channelHeader">
                    <h2 style="margin: 0 0 10px 0; font-size: 2rem; color: white;" id="chTitle">اسم القناة</h2>
                    <div class="ch-stats">
                        <div class="ch-stat-badge">
                            <i class="fa-solid fa-eye"></i>
                            إجمالي المشاهدات: <span id="chViews">0</span>
                        </div>
                        <div class="ch-stat-badge">
                            <i class="fa-solid fa-users"></i>
                            المشتركون: <span id="chSubs">0</span>
                        </div>
                        <div class="ch-stat-badge">
                            <i class="fa-solid fa-video"></i>
                            عدد الفيديوهات: <span id="chVidsCount">0</span>
                        </div>
                    </div>
                </div>

                <h3
                    style="margin-bottom: 15px; font-size: 1.5rem; border-bottom: 2px solid rgba(255,255,255,0.1); padding-bottom: 10px;">
                    أحدث الفيديوهات</h3>
                <div class="stats-grid" id="videosGrid">
                    <!-- Videos injected here by JS -->
                </div>
            </div>

        </main>
    </div>

    <script>
        const channelSelect = document.getElementById('channelSelect');
        const loadingSpinner = document.getElementById('loadingSpinner');
        const statsContainer = document.getElementById('statsContainer');
        const videosGrid = document.getElementById('videosGrid');

        const chTitle = document.getElementById('chTitle');
        const chViews = document.getElementById('chViews');
        const chSubs = document.getElementById('chSubs');
        const chVidsCount = document.getElementById('chVidsCount');

        function formatNumber(num) {
            return new Intl.NumberFormat('en-US').format(parseInt(num) || 0);
        }

        channelSelect.addEventListener('change', async (e) => {
            const channelId = e.target.value;
            if (!channelId) {
                statsContainer.style.display = 'none';
                return;
            }

            statsContainer.style.display = 'none';
            loadingSpinner.style.display = 'block';
            videosGrid.innerHTML = '';

            try {
                const response = await fetch(`/api/youtube/stats/${channelId}`);
                const data = await response.json();

                if (!data.success) {
                    alert('خطأ في جلب الإحصائيات: ' + (data.error || 'Unknown error'));
                    loadingSpinner.style.display = 'none';
                    return;
                }

                // Populate Channel Stats
                chTitle.textContent = channelSelect.options[channelSelect.selectedIndex].text;
                chViews.textContent = formatNumber(data.channel_stats.viewCount);
                chSubs.textContent = formatNumber(data.channel_stats.subscriberCount);
                chVidsCount.textContent = formatNumber(data.channel_stats.videoCount);

                // Populate Videos
                if (data.videos && data.videos.length > 0) {
                    data.videos.forEach(v => {
                        const card = document.createElement('a');
                        card.href = `https://youtube.com/watch?v=${v.id}`;
                        card.target = '_blank';
                        card.className = 'video-card';
                        card.style.textDecoration = 'none';

                        card.innerHTML = `
                            <img src="${v.thumbnail}" class="vid-thumb" alt="Thumbnail">
                            <div class="vid-info">
                                <h4 class="vid-title">${v.title}</h4>
                                <div class="vid-meta">
                                    <div class="meta-item" title="المشاهدات"><i class="fa-solid fa-eye"></i> ${formatNumber(v.views)}</div>
                                    <div class="meta-item" title="اللايكات"><i class="fa-solid fa-thumbs-up"></i> ${formatNumber(v.likes)}</div>
                                    <div class="meta-item" title="التعليقات"><i class="fa-solid fa-comment"></i> ${formatNumber(v.comments)}</div>
                                </div>
                            </div>
                        `;
                        videosGrid.appendChild(card);
                    });
                } else {
                    videosGrid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #aaa; padding: 20px;">لا توجد فيديوهات في هذه القناة.</p>';
                }

                loadingSpinner.style.display = 'none';
                statsContainer.style.display = 'block';

            } catch (err) {
                loadingSpinner.style.display = 'none';
                alert('حدث خطأ في الاتصال بالسيرفر.');
                console.error(err);
            }
        });
    </script>
</body>

</html>
